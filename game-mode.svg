<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1745"/>
      <stop offset="1" stop-color="#0b1a36"/>
    </linearGradient>
    <linearGradient id="game" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#ff4f6d"/>
    </linearGradient>
    <linearGradient id="rest" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3d9eff"/>
      <stop offset="1" stop-color="#6d6bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- the chip and its pins -->
  <g stroke="#8f96d8" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M36 14 v-6"/><path d="M52 14 v-6"/><path d="M68 14 v-6"/><path d="M84 14 v-6"/>
    <path d="M36 114 v6"/><path d="M52 114 v6"/><path d="M68 114 v6"/><path d="M84 114 v6"/>
    <path d="M14 40 h-6"/><path d="M14 64 h-6"/><path d="M14 88 h-6"/>
    <path d="M114 40 h6"/><path d="M114 64 h6"/><path d="M114 88 h6"/>
  </g>
  <rect x="14" y="14" width="100" height="100" rx="20" fill="url(#bg)"
        stroke="#8f96d8" stroke-opacity="0.55" stroke-width="2"/>

  <!-- background cores: blue, dim -->
  <g opacity="0.75">
    <rect x="26" y="70" width="20" height="32" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="26" y="84" width="20" height="18" rx="5" fill="url(#rest)"/>
    <rect x="54" y="70" width="20" height="32" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="54" y="78" width="20" height="24" rx="5" fill="url(#rest)"/>
    <rect x="82" y="70" width="20" height="32" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="82" y="88" width="20" height="14" rx="5" fill="url(#rest)"/>
  </g>

  <!-- the reserved cores: one lit lane with a controller over it -->
  <g filter="url(#glow)">
    <rect x="26" y="26" width="76" height="36" rx="10" fill="url(#game)"/>
  </g>
  <rect x="26" y="26" width="76" height="36" rx="10" fill="none"
        stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.9"/>
  <g transform="translate(64 44)">
    <path d="M-20 -9 h40 a9 9 0 0 1 0 18 h-40 a9 9 0 0 1 0 -18 z" fill="#ffffff"/>
    <g fill="#1b1745">
      <rect x="-19" y="-2" width="12" height="4" rx="1"/>
      <rect x="-15" y="-6" width="4" height="12" rx="1"/>
      <circle cx="10" cy="2.5" r="2.6"/>
      <circle cx="16" cy="-2.5" r="2.6"/>
    </g>
  </g>
</svg>
