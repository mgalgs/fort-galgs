# Fort Galgs: which cores the fort holds and who always lives inside it.
# Read by fortctl, as you and as root, each time it runs.

# How many physical cores to reserve. Each brings its SMT sibling along, and
# the fastest-boosting cores are picked first. Leave at least one outside.
reserve_cores = 2

# Process names (as in /proc/<pid>/comm, at most 15 characters) whose apps
# are pulled into the fort whenever it is up, including ones that start
# later. Anything else can be moved in and out by hand, in the window or
# with `fortctl protect <name>`.
protect = []
